monolog:
    channels:
        - contact
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                max_files: 7
                channels: ['!event']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']
            contact:
                type: rotating_file
                path: '%kernel.logs_dir%/contact.log'
                level: debug
                max_files: 7
                channels: [contact]
            deprecation:
                type: rotating_file
                path: '%kernel.logs_dir%/deprecations.log'
                max_files: 7
                channels: [deprecation]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event']
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: main_rotating
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
                channels: ['!event']
            main_rotating:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                max_files: 14
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine']
