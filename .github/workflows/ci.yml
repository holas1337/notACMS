name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, gd, imagick
          coverage: none

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
          magick --version

      - name: Seed demo content
        run: |
          if [ ! -f local/content/_site.yaml ]; then
            cp -r docs/demo/content/. local/content/
            cp -r docs/demo/translations/. local/translations/
            cp -r docs/demo/docker/nginx/. local/docker/nginx/
            cp -r docs/demo/docs/. local/docs/
            cp -r docs/demo/assets/. local/assets/
          fi

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Build SASS
        run: bin/console sass:build

      - name: Validate composer.json
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit

      - name: Lint Twig templates
        run: bin/console lint:twig templates --show-deprecations

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run

      - name: Run PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox
