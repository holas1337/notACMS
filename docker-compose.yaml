services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8123}:80"
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - .:/app:ro
    networks:
      - default
      - web
    restart: ${RESTART}
    labels:
      # Router and middleware names include COMPOSE_PROJECT_NAME so multiple
      # notACMS stacks on the same Traefik/web network don't collide.
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${URL}`) || Host(`www.${URL}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${CERTRESOLVER}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.docker.network=web
      ### redirect www to non www URL + gzip middlewares
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-nonwwwredirect.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-nonwwwredirect.redirectregex.replacement=https://$${1}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${COMPOSE_PROJECT_NAME}-nonwwwredirect,gzip

  php:
    profiles:
      - runtime
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    networks:
      - default
    restart: ${RESTART}

networks:
  default:
  web:
    external: true
