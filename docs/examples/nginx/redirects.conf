# Site-specific redirects — included inside the server {} block.
# Replace with your own redirects. Common use cases:
#   - Old CMS/WordPress URLs → new clean slugs
#   - /uploads/ image paths → /media/
#   - Renamed pages or reorganised categories
#
# LOCALE-DEPENDENT sections are marked; add equivalents when adding a new locale.

# Old cookie policy page → privacy policy
# LOCALE-DEPENDENT: PL target URL uses translated slug
location = /cookie-policy/    { return 301 /privacy-policy/; }
location = /pl/cookie-policy/ { return 301 /pl/polityka-prywatnosci/; }

# Old WordPress category URLs → new blog category URLs
# LOCALE-DEPENDENT: PL-specific legacy redirects
location = /category/community/ { return 301 /blog/community/; }
location = /category/tutorials/ { return 301 /blog/tutorials/; }
location = /category/projects/  { return 301 /blog/projects/; }

# Old PL listing/page URLs → new /pl/ prefixed URLs
# LOCALE-DEPENDENT: PL-specific legacy redirects
location = /wpisy/    { return 301 /pl/wpisy/; }
location = /o-mnie/   { return 301 /pl/o-mnie/; }
location = /kontakt/  { return 301 /pl/kontakt/; }

# Old individual post URLs (WordPress dated format) → new clean slugs
location = /2024/03/15/my-first-walk-in-an-old-growth-forest/ { return 301 /blog/my-first-walk-in-an-old-growth-forest/; }
location = /2024/06/22/identifying-trees-in-winter/           { return 301 /blog/identifying-trees-in-winter/; }
location = /2024/09/10/building-a-forest-trail-guide/         { return 301 /blog/building-a-forest-trail-guide/; }

# Old PL post URLs (WordPress dated format) → new /pl/wpisy/ URLs
# LOCALE-DEPENDENT: PL-specific legacy redirects
location = /2024/03/15/moj-pierwszy-spacer-w-pradawnym-lesie/ { return 301 /pl/wpisy/moj-pierwszy-spacer-w-pradawnym-lesie/; }
location = /2024/06/22/rozpoznawanie-drzew-w-zimie/           { return 301 /pl/wpisy/rozpoznawanie-drzew-w-zimie/; }
location = /2024/09/10/przewodnik-po-sciezkach-lesnych/       { return 301 /pl/wpisy/przewodnik-po-sciezkach-lesnych/; }

# Catch-all: /pl/YYYY/MM/DD/slug/ → /pl/wpisy/slug/
# LOCALE-DEPENDENT: add similar catch-all for each non-default locale
location ~ "^/pl/\d{4}/\d{2}/\d{2}/([a-z0-9-]+)/$" { return 301 /pl/wpisy/$1/; }

# Catch-all: /YYYY/MM/DD/slug/ → /blog/slug/
# LOCALE-DEPENDENT: target path uses default locale's blog route
location ~ "^\d{4}/\d{2}/\d{2}/([a-z0-9-]+)/$" { return 301 /blog/$1/; }

# Old /uploads/ image paths → new /media/ paths
location = /uploads/2024/03/old-growth-forest.jpg  { return 301 /media/old-growth-forest-walk/old-growth-forest.jpg; }
location = /uploads/2024/06/trees-in-winter.jpg    { return 301 /media/trees-in-winter/trees-in-winter.jpg; }
location = /uploads/2024/09/forest-trail.jpg       { return 301 /media/forest-trail-guide/forest-trail.jpg; }
