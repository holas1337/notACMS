# Locale-aware error pages — included inside the server {} block.
# Serves the correct locale's error page based on the URL prefix.
# Add one if-block per non-default locale configured in local/content/_site.yaml.
#
# To add a new locale (e.g. German /de/):
#   - Duplicate the if-blocks below and replace "^/pl/" with "^/de/"
#   - Replace /pl/404.html with /de/404.html, etc.

error_page 404 @error_404;
location @error_404 {
    root /app/public/static;
    if ($request_uri ~ "^/pl/") { rewrite ^ /pl/404.html break; }
    rewrite ^ /404.html break;
}

error_page 500 502 503 504 @error_5xx;
location @error_5xx {
    root /app/public/static;
    if ($request_uri ~ "^/pl/") { rewrite ^ /pl/500.html break; }
    rewrite ^ /500.html break;
}
