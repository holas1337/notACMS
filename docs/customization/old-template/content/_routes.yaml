# yaml-language-server: $schema=https://raw.githubusercontent.com/holas1337/notACMS/main/config/schema/routes.schema.json
# Locale-specific URL path overrides for structural routes.
# Only non-default locales that differ from the default (EN) path need entries here.
# Routes not listed: non-default locales auto-prefix the default path with /{locale}/.
# Example: blog_tag not listed → EN: /tag/{tag}/ → PL: /pl/tag/{tag}/

routes:
  blog_list:
    pl: /wpisy/
  blog_list_paginated:
    pl: /wpisy/strona/{page}/
  blog_category:
    pl: /wpisy/{category}/
  blog_archive:
    pl: /archiwum/{year}/{month}/
  blog_archive_year:
    pl: /archiwum/{year}/
  contact:
    pl: /kontakt/
  projects:
    pl: /realizacje/
  search:
    pl: /szukaj/
