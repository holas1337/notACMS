# Demo-theme Content-Security-Policy override.
# This file is auto-seeded on first deploy from docs/demo/docker/nginx/csp.conf.
# Edit freely — the bootstrap never overwrites it after seeding.
#
# The demo theme pulls two external-origin assets:
#   - Phosphor Icons script from unpkg.com   (docs/demo/templates/base.html.twig)
#   - Inter / JetBrains Mono webfonts from fonts.googleapis.com / fonts.gstatic.com
#
# Removing either from the theme lets you drop the matching origin here.

set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' data: challenges.cloudflare.com static.cloudflareinsights.com unpkg.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com unpkg.com; font-src 'self' fonts.gstatic.com unpkg.com; img-src 'self' data:; frame-src challenges.cloudflare.com; connect-src 'self' challenges.cloudflare.com cloudflareinsights.com;";
