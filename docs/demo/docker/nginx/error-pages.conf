# Locale-aware error pages.
# This file is auto-seeded on first deploy from docs/demo/docker/nginx/error-pages.conf.
# Edit freely — the bootstrap never overwrites it after seeding.
#
# The core nginx.conf.template handles the default locale fallback.
# Add an if-block for each non-default locale below.

location @error_404 {
    root /app/public/static;
    if ($request_uri ~ "^/de/") { rewrite ^ /de/404.html break; }
    if ($request_uri ~ "^/pl/") { rewrite ^ /pl/404.html break; }
    if ($request_uri ~ "^/fr/") { rewrite ^ /fr/404.html break; }
    rewrite ^ /404.html break;
}

location @error_5xx {
    root /app/public/static;
    if ($request_uri ~ "^/de/") { rewrite ^ /de/500.html break; }
    if ($request_uri ~ "^/pl/") { rewrite ^ /pl/500.html break; }
    if ($request_uri ~ "^/fr/") { rewrite ^ /fr/500.html break; }
    rewrite ^ /500.html break;
}