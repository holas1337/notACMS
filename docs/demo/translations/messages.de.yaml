home:
  hero_badge: Open Source · PHP / Symfony
  hero_heading: Der Static Site Generator, der<br><em>einfach nicht stört.</em>
  hero_sub: Schreib Markdown. Definiere Struktur in YAML. Führe einen Befehl aus.
    Erhalte reines statisches HTML — keine Datenbank, keine Laufzeit, keine Überraschungen.
  hero_cta: Loslegen
  stat_db: Datenbanktabellen
  stat_static: Statische Ausgabe
  stat_ai: KI-freundliche Struktur
  what_label: Was ist notACMS?
  what_heading: Ein CMS, das zur Laufzeit<br>nichts speichert.
  what_p1: <strong>notACMS</strong> ist ein PHP/Symfony Static Site Generator für
    Entwickler, die volle Kontrolle wollen. Inhalte leben in Markdown + YAML-Dateien.
    Templates sind Twig. Die Ausgabe ist reines HTML.
  what_p2: Keine Datenbankmigrationen. Keine Plugin-Konflikte. Kein CMS-Lock-in. Nur
    ein Build-Schritt, der das <code>local/content/</code>-Verzeichnis in eine vollständige
    statische Website umwandelt.
  what_p3: <strong>Für KI-freundliche Workflows konzipiert</strong> — Flat Files sind
    trivial zu lesen, zu durchsuchen und mit LLMs zu generieren.
  stat_db_label: Datenbankabhängigkeit
  stat_db_desc: Inhalte leben in Flat Markdown + YAML-Dateien. Kein ORM, keine Migrationen.
  stat_cmd_label: Build-Befehl
  stat_cmd_desc: <code>./notACMS deploy</code> gibt die komplette Website nach <code>public/static/</code>
    aus.
  stat_locales_label: Unterstützte Locales
  stat_locales_desc: Füge eine Zeile in <code>_site.yaml</code> hinzu. Inhalte pro
    Locale co-lokalisiert.
  stat_license_label: Lizenziert
  stat_license_desc: Fork it, extend it, make it yours. Kein Vendor-Lock-in.
  features_label: Features
  features_heading: Alles was du brauchst.<br>Nichts was du nicht brauchst.
  features_sub: Aufgebaut auf Symfony 7.4 und PHP 8.5. Vertraute Werkzeuge, minimale
    Magie.
  feat_md_title: Markdown + YAML
  feat_md_desc: Inhalte in Markdown mit YAML-Frontmatter schreiben. CommonMark mit
    Überschriften, Tabellen, Callouts.
  feat_i18n_title: Mehrsprachig
  feat_i18n_desc: First-class i18n. Inhalte pro Locale co-lokalisiert. URL-Überschreibungen
    je Sprache. hreflang out of the box.
  feat_search_title: Volltextsuche
  feat_search_desc: Pagefind-Integration. Statische Suche ohne Serverkosten, beim
    Build indexiert. Keine externe API.
  feat_php_title: PHP / Symfony Core
  feat_php_desc: Vollständiges Symfony DI, Console-Commands, Twig-Templates, SCSS
    via AssetMapper. PHP-Entwickler fühlen sich sofort zu Hause.
  how_label: So funktioniert's
  how_heading: Drei Schritte von der<br>Idee zur Live-Site.
  step1_title: Inhalt schreiben
  step1_desc: Markdown-Dateien in <code>local/content/</code> mit YAML-Frontmatter
    erstellen. Seiten, Beiträge und Locales nach Bedarf hinzufügen.
  step2_title: Bauen
  step2_desc: Führe <code>./notACMS deploy --prod</code> aus. notACMS kompiliert SCSS,
    verarbeitet Bilder, rendert Twig-Templates und generiert das gesamte statische
    HTML.
  step3_title: Überall deployen
  step3_desc: Lade <code>public/</code> auf jeden Webserver, CDN oder Static Host
    hoch. Keine PHP-Laufzeit erforderlich — außer im Live-Modus.
  meta_text: Diese Seite ist mit notACMS gebaut.
  meta_sub: 'Ein lebendiger Proof-of-Concept: Das Produkt dokumentiert und vermarktet
    sich selbst mit genau den Werkzeugen, die es bereitstellt.'
  meta_github: Quellcode auf GitHub ansehen
