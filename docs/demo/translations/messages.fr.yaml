home:
  hero_badge: Open Source · PHP / Symfony
  hero_heading: Le générateur de sites statiques<br><em>qui ne vous gêne pas.</em>
  hero_sub: Écrivez en Markdown. Définissez la structure en YAML. Exécutez une commande.
    Obtenez du HTML statique pur — pas de base de données, pas d'exécution, pas de surprises.
  hero_cta: Commencer
  stats_label: Statistiques clés
  stat_db: Tables de base de données
  stat_static: Sortie statique
  stat_ai: Structure conviviale pour l'IA
  what_label: Qu'est-ce que notACMS ?
  what_heading: Un CMS qui ne stocke<br>rien à l'exécution.
  what_p1: <strong>notACMS</strong> est un générateur de sites statiques PHP/Symfony
    pour les développeurs qui veulent un contrôle total. Le contenu vit dans des fichiers
    Markdown + YAML. Les templates sont en Twig. La sortie est du HTML pur.
  what_p2: Pas de migrations de base de données. Pas de conflits de plugins. Pas de
    verrouillage CMS. Juste une étape de build qui transforme le répertoire <code>local/content/</code>
    en un site statique complet.
  what_p3: <strong>Conçu pour des workflows conviviaux pour l'IA</strong> — les fichiers
    plats sont triviaux à lire, rechercher et générer avec des LLM.
  stat_db_label: Dépendance à la base de données
  stat_db_desc: Le contenu vit dans des fichiers Markdown + YAML plats. Pas d'ORM,
    pas de migrations.
  stat_cmd_label: Commande de build
  stat_cmd_desc: <code>./notACMS deploy</code> génère le site complet dans <code>public/static/</code>.
  stat_locales_label: Langues supportées
  stat_locales_desc: Ajoutez une langue avec une ligne dans <code>_site.yaml</code>.
    Contenu co-localisé par langue.
  stat_license_label: Licence
  stat_license_desc: Forkez, étendez, personnalisez. Pas de verrouillage éditeur.
  features_label: Fonctionnalités
  features_heading: Tout ce dont vous avez besoin.<br>Rien de superflu.
  features_sub: Basé sur Symfony 7.4 et PHP 8.5. Des outils familiers, un minimum
    de magie.
  feat_md_title: Markdown + YAML
  feat_md_desc: Écrivez le contenu en Markdown avec du frontmatter YAML. CommonMark
    avec titres, tableaux, callouts.
  feat_i18n_title: Multilingue
  feat_i18n_desc: i18n natif. Contenu co-localisé par langue. URLs personnalisées par
    langue. hreflang inclus.
  feat_search_title: Recherche plein texte
  feat_search_desc: Intégration Pagefind. Recherche statique sans coût serveur, indexée
    au build. Pas d'API externe.
  feat_php_title: Cœur PHP / Symfony
  feat_php_desc: DI Symfony complète, commandes console, templates Twig, SCSS via
    AssetMapper. Les développeurs PHP se sentent chez eux.
  how_label: Comment ça marche
  how_heading: Trois étapes de l'idée<br>au site en ligne.
  step1_title: Écrire le contenu
  step1_desc: Créez des fichiers Markdown dans <code>local/content/</code> avec du
    frontmatter YAML. Ajoutez pages, articles et langues selon vos besoins.
  step2_title: Builder
  step2_desc: Exécutez <code>./notACMS deploy --prod</code>. notACMS compile le SCSS,
    traite les images, rend les templates Twig et génère tout le HTML statique.
  step3_title: Déployer partout
  step3_desc: Uploadez <code>public/</code> sur n'importe quel serveur web, CDN ou
    hébergement statique. Pas d'exécution PHP requise — sauf en mode live.
  meta_text: Ce site est construit avec notACMS.
  meta_sub: 'Un proof-of-concept vivant : le produit se documente et se commercialise
    lui-même avec les outils qu''il fournit.'
  meta_github: Voir le code source sur GitHub
