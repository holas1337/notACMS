home:
  hero_badge: Open Source · PHP / Symfony
  hero_heading: Generator stron statycznych, który<br><em>po prostu nie przeszkadza.</em>
  hero_sub: Pisz w Markdown. Definiuj strukturę w YAML. Uruchom jedno polecenie. Uzyskaj
    czysty statyczny HTML — brak bazy danych, brak serwera, brak niespodzianek.
  hero_cta: Zacznij
  stat_db: Tabel w bazie danych
  stat_static: Statyczny wynik
  stat_ai: Przyjazna struktura
  what_label: Czym jest notACMS?
  what_heading: CMS, który w czasie działania<br>nic nie przechowuje.
  what_p1: <strong>notACMS</strong> to generator stron statycznych PHP/Symfony dla
    programistów, którzy chcą pełnej kontroli. Treść żyje w plikach Markdown + YAML.
    Szablony to Twig. Wynik to czysty HTML.
  what_p2: Żadnych migracji baz danych. Żadnych konfliktów wtyczek. Żadnego vendor
    lock-in. Tylko krok budowania, który zamienia katalog <code>local/content/</code>
    w kompletną stronę statyczną.
  what_p3: <strong>Zaprojektowany dla przepływów pracy przyjaznych AI</strong> — płaskie
    pliki są trywialne do odczytu, wyszukiwania i generowania przez LLM.
  stat_db_label: Zależność od bazy danych
  stat_db_desc: Treść żyje w płaskich plikach Markdown + YAML. Brak ORM, brak migracji.
  stat_cmd_label: Polecenie budowania
  stat_cmd_desc: <code>./notACMS deploy</code> generuje kompletną stronę do <code>public/static/</code>.
  stat_locales_label: Obsługiwanych lokali
  stat_locales_desc: Dodaj dowolny język jedną linią w <code>_site.yaml</code>. Treść
    zlokalizowana per lokal.
  stat_license_label: Licencja
  stat_license_desc: Forkuj, rozszerzaj, dostosuj do swoich potrzeb. Brak vendor lock-in.
  features_label: Funkcje
  features_heading: Wszystko, czego potrzebujesz.<br>Nic czego nie potrzebujesz.
  features_sub: Zbudowany na Symfony 7.4 i PHP 8.5. Znajome narzędzia, minimalna magia.
  feat_md_title: Markdown + YAML
  feat_md_desc: Pisz treść w Markdown z frontmatter YAML. CommonMark z nagłówkami,
    tabelami, calloutami.
  feat_i18n_title: Wielojęzyczność
  feat_i18n_desc: Pełne wsparcie i18n. Treść zlokalizowana per lokal. Nadpisywanie
    URL per język. hreflang od razu.
  feat_search_title: Wyszukiwanie pełnotekstowe
  feat_search_desc: Integracja z Pagefind. Statyczne wyszukiwanie bez kosztów serwera,
    indeksowane podczas budowania. Brak zewnętrznego API.
  feat_php_title: PHP / Symfony Core
  feat_php_desc: Pełny Symfony DI, polecenia konsolowe, szablony Twig, SCSS przez
    AssetMapper. Programiści PHP czują się jak w domu.
  how_label: Jak to działa
  how_heading: Trzy kroki od pomysłu<br>do działającej strony.
  step1_title: Pisz treść
  step1_desc: Twórz pliki Markdown w <code>local/content/</code> z frontmatter YAML.
    Dodawaj strony, wpisy i lokale według potrzeb.
  step2_title: Zbuduj
  step2_desc: Uruchom <code>./notACMS deploy --prod</code>. notACMS kompiluje SCSS,
    przetwarza obrazy, renderuje szablony Twig i generuje cały statyczny HTML.
  step3_title: Wdróż gdziekolwiek
  step3_desc: Prześlij <code>public/</code> na dowolny serwer WWW, CDN lub hosting
    statyczny. PHP nie jest wymagane w czasie serwowania — chyba że używasz trybu
    live.
  meta_text: Ta strona jest zbudowana z notACMS.
  meta_sub: 'Żywy proof-of-concept: produkt dokumentuje i promuje się sam przy użyciu
    dokładnie tych samych narzędzi, które dostarcza.'
  meta_github: Zobacz źródło na GitHub
