home:
  hero_badge: Open Source · PHP / Symfony
  hero_heading: The static site generator that<br><em>gets out of your way.</em>
  hero_sub: Write Markdown. Define structure in YAML. Run one command. Get pure static
    HTML — no database, no runtime, no surprises.
  hero_cta: Get Started
  stats_label: Key stats
  stat_db: Database tables
  stat_static: Static output
  stat_ai: Friendly structure
  what_label: What is notACMS?
  what_heading: A CMS that stores<br>nothing at runtime.
  what_p1: <strong>notACMS</strong> is a PHP/Symfony static site generator built for
    developers who want full control. Your content lives in Markdown + YAML files.
    Your templates are Twig. Your output is pure HTML.
  what_p2: No database migrations. No plugin conflicts. No CMS lock-in. Just a build
    step that turns your <code>local/content/</code> directory into a complete static
    site.
  what_p3: <strong>Designed for AI-friendly workflows</strong> — flat files are trivial
    to read, search, and generate with LLMs.
  stat_db_label: Database dependency
  stat_db_desc: Content lives in flat Markdown + YAML files. No ORM, no migrations.
  stat_cmd_label: Build command
  stat_cmd_desc: <code>./notACMS deploy</code> outputs your complete site to <code>public/static/</code>.
  stat_locales_label: Locales supported
  stat_locales_desc: Add any language with a line in <code>_site.yaml</code>. Content
    co-located per locale.
  stat_license_label: Licensed
  stat_license_desc: Fork it, extend it, make it yours. No vendor lock-in.
  features_label: Features
  features_heading: Everything you need.<br>Nothing you don't.
  features_sub: Built on Symfony 7.4 and PHP 8.5. Familiar tools, minimal magic.
  feat_md_title: Markdown + YAML
  feat_md_desc: Write content in Markdown with YAML frontmatter. CommonMark with headings,
    tables, callouts.
  feat_i18n_title: Multilingual
  feat_i18n_desc: First-class i18n. Content co-located per locale. URL overrides per
    language. hreflang out of the box.
  feat_search_title: Full-text Search
  feat_search_desc: Pagefind integration. Static, zero-server-cost search indexed
    at build time. No external API.
  feat_php_title: PHP / Symfony Core
  feat_php_desc: Full Symfony DI, console commands, Twig templates, SCSS via AssetMapper.
    PHP devs feel at home.
  how_label: How it Works
  how_heading: Three steps from<br>idea to live site.
  step1_title: Write content
  step1_desc: Create Markdown files in <code>local/content/</code> with YAML frontmatter.
    Add pages, posts, and locales as needed.
  step2_title: Build
  step2_desc: Run <code>./notACMS deploy --prod</code>. notACMS compiles SCSS, processes
    images, renders Twig templates, and generates all static HTML.
  step3_title: Deploy anywhere
  step3_desc: Upload <code>public/</code> to any web server, CDN, or static host.
    No PHP runtime required — unless you use live mode.
  meta_text: This site is built with notACMS.
  meta_sub: 'A living proof-of-concept: the product documents and markets itself using
    exactly the tools it provides.'
  meta_github: View source on GitHub
